<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Détail outil — Inventaire Outils</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="page-avec-barre-fixe">

<header class="app-header">
  <a href="outils.html" class="btn-back" aria-label="Retour">←</a>
  <h1>Détail de l'outil</h1>
  <div class="header-actions">
    <button class="btn-icon" id="btn-supprimer" aria-label="Supprimer">🗑️</button>
  </div>
</header>

<main class="container" id="conteneur-principal">
  <div class="loading">Chargement...</div>
</main>

<div class="bottom-fixed-stack">
  <div class="sticky-actions">
    <button type="submit" form="form-outil" class="btn btn-primary btn-block">Enregistrer</button>
  </div>
  <nav class="bottom-nav">
    <a href="index.html"><span class="icon">🏠</span>Accueil</a>
    <a href="outils.html" class="active"><span class="icon">🔧</span>Outils</a>
    <a href="groupes.html"><span class="icon">📦</span>Groupes</a>
    <a href="localisations.html"><span class="icon">📍</span>Lieux</a>
    <a href="notes.html"><span class="icon">📝</span>Notes</a>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="js/supabase.js"></script>
<script src="js/photo.js"></script>
<script>
// Logique de la fiche détaillée d'un outil (outil-detail.html)

function afficherToast(message) {
  const toast = document.getElementById('toast')
  toast.textContent = message
  toast.classList.add('show')
  setTimeout(() => toast.classList.remove('show'), 2500)
}

function escapeHtml(texte) {
  if (texte == null) return ''
  const div = document.createElement('div')
  div.textContent = texte
  return div.innerHTML
}

const params = new URLSearchParams(window.location.search)
const outilId = params.get('id')
const conteneur = document.getElementById('conteneur-principal')

if (!outilId) {
  conteneur.innerHTML = '<div class="empty-state">Outil introuvable</div>'
} else {
  chargerOutil()
}

async function chargerOutil() {
  const [{ data: outil, error }, { data: groupes }, { data: localisations }, { data: categories }] = await Promise.all([
    supabase.from('outils').select('*').eq('id', outilId).single(),
    supabase.from('groupes').select('id, nom').order('nom'),
    supabase.from('localisations').select('id, nom').order('nom'),
    supabase.from('categories').select('id, nom').order('nom'),
  ])

  if (error || !outil) {
    conteneur.innerHTML = '<div class="empty-state">Outil introuvable</div>'
    return
  }

  conteneur.innerHTML = `
    <form id="form-outil">
      <div class="field">
        <label for="nom">Nom *</label>
        <input type="text" id="nom" required>
      </div>
      <div class="form-row">
        <div class="field">
          <label for="categorie_id">Catégorie</label>
          <select id="categorie_id">
            ${categories.map(c => `<option value="${c.id}">${escapeHtml(c.nom)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label for="quantite">Quantité</label>
          <input type="number" id="quantite" min="1">
        </div>
      </div>

      <div class="field">
        <label for="groupe_id">Groupe</label>
        <select id="groupe_id">
          <option value="">— Aucun —</option>
          ${groupes.map(g => `<option value="${g.id}">${escapeHtml(g.nom)}</option>`).join('')}
        </select>
      </div>
      <div class="field hidden" id="champ-dans-groupe">
        <div class="checkbox-row">
          <input type="checkbox" id="dans_groupe">
          <label for="dans_groupe">Actuellement dans le groupe</label>
        </div>
      </div>
      <div class="field" id="champ-localisation">
        <label for="localisation_id">Localisation</label>
        <select id="localisation_id">
          <option value="">— Aucune —</option>
          ${localisations.map(l => `<option value="${l.id}">${escapeHtml(l.nom)}</option>`).join('')}
        </select>
      </div>

      <div class="section-title">Achat</div>
      <div class="form-row">
        <div class="field">
          <label for="prix_achat">Prix d'achat ($)</label>
          <input type="number" id="prix_achat" step="0.01">
        </div>
        <div class="field">
          <label for="date_achat">Date d'achat</label>
          <input type="date" id="date_achat">
        </div>
      </div>
      <div class="field">
        <label for="magasin">Magasin</label>
        <input type="text" id="magasin">
      </div>

      <div class="section-title">Garantie</div>
      <div class="form-row">
        <div class="field">
          <label for="numero_serie">Numéro de série</label>
          <input type="text" id="numero_serie">
        </div>
        <div class="field">
          <label for="date_garantie">Fin de garantie</label>
          <input type="date" id="date_garantie">
        </div>
      </div>

      <div class="field">
        <label for="notes">Notes</label>
        <textarea id="notes"></textarea>
      </div>
    </form>

    <div class="section-title">Photo</div>
    <div class="card" style="text-align:center;">
      <img id="photo-apercu" class="hidden" alt="">
      <div class="empty-state" id="photo-vide" style="padding:20px 0;">Aucune photo</div>
      <div class="form-actions">
        <label class="btn btn-secondary btn-block" style="cursor:pointer;">
          Prendre / choisir une photo
          <input type="file" accept="image/*" id="input-photo" class="hidden">
        </label>
      </div>
    </div>

    <div class="section-title">Code QR</div>
    <div class="card" id="qr-print-area" style="text-align:center;">
      <div style="font-family:var(--font-head); font-weight:700; text-transform:uppercase; letter-spacing:.04em; font-size:.85rem; margin-bottom:12px;" id="qr-nom-outil"></div>
      <div id="qrcode-container" style="display:flex; justify-content:center;"></div>
      <div class="form-actions no-print">
        <button type="button" class="btn btn-secondary" id="btn-imprimer-qr">Imprimer</button>
        <button type="button" class="btn btn-secondary" id="btn-telecharger-qr">Télécharger</button>
      </div>
    </div>
  `

  const imgApercu = document.getElementById('photo-apercu')
  const photoVide = document.getElementById('photo-vide')

  function afficherPhoto(url) {
    if (url) {
      imgApercu.src = url
      imgApercu.classList.remove('hidden')
      photoVide.classList.add('hidden')
    } else {
      imgApercu.classList.add('hidden')
      photoVide.classList.remove('hidden')
    }
  }
  afficherPhoto(outil.photo_url)

  document.getElementById('input-photo').addEventListener('change', async (e) => {
    const fichier = e.target.files[0]
    if (!fichier) return
    afficherToast('Envoi de la photo...')
    try {
      const url = await televerserPhoto(fichier, 'outils', outilId)
      const { error } = await supabase.from('outils').update({ photo_url: url }).eq('id', outilId)
      if (error) throw error
      afficherPhoto(url)
      afficherToast('Photo enregistrée')
    } catch (err) {
      afficherToast('Erreur lors de l\'envoi de la photo')
    }
  })

  document.getElementById('qr-nom-outil').textContent = outil.nom
  const urlOutil = `${window.location.origin}${window.location.pathname}?id=${outilId}`
  new QRCode(document.getElementById('qrcode-container'), {
    text: urlOutil,
    width: 220,
    height: 220,
    colorDark: '#0c0d0c',
    colorLight: '#f3f1ea',
    correctLevel: QRCode.CorrectLevel.M,
  })

  document.getElementById('btn-telecharger-qr').addEventListener('click', () => {
    const canvas = document.querySelector('#qrcode-container canvas')
    const nomFichier = outil.nom.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '')
    const lien = document.createElement('a')
    lien.download = `qr-${nomFichier || 'outil'}.png`
    lien.href = canvas.toDataURL('image/png')
    lien.click()
  })

  document.getElementById('btn-imprimer-qr').addEventListener('click', () => {
    window.print()
  })

  document.getElementById('nom').value = outil.nom
  document.getElementById('categorie_id').value = outil.categorie_id || ''
  document.getElementById('quantite').value = outil.quantite
  document.getElementById('groupe_id').value = outil.groupe_id || ''
  document.getElementById('dans_groupe').checked = outil.dans_groupe
  document.getElementById('localisation_id').value = outil.localisation_id || ''
  document.getElementById('prix_achat').value = outil.prix_achat ?? ''
  document.getElementById('date_achat').value = outil.date_achat ?? ''
  document.getElementById('magasin').value = outil.magasin ?? ''
  document.getElementById('numero_serie').value = outil.numero_serie ?? ''
  document.getElementById('date_garantie').value = outil.date_garantie ?? ''
  document.getElementById('notes').value = outil.notes ?? ''

  const selectGroupe = document.getElementById('groupe_id')
  const checkboxDansGroupe = document.getElementById('dans_groupe')
  const champDansGroupe = document.getElementById('champ-dans-groupe')
  const champLocalisation = document.getElementById('champ-localisation')

  function mettreAJourVisibiliteChamps() {
    const groupeChoisi = selectGroupe.value !== ''
    champDansGroupe.classList.toggle('hidden', !groupeChoisi)
    const localisationNecessaire = !groupeChoisi || !checkboxDansGroupe.checked
    champLocalisation.classList.toggle('hidden', !localisationNecessaire)
  }

  selectGroupe.addEventListener('change', mettreAJourVisibiliteChamps)
  checkboxDansGroupe.addEventListener('change', mettreAJourVisibiliteChamps)
  mettreAJourVisibiliteChamps()

  document.getElementById('form-outil').addEventListener('submit', async (e) => {
    e.preventDefault()
    const groupeChoisi = selectGroupe.value || null
    const valeurs = {
      nom: document.getElementById('nom').value.trim(),
      categorie_id: document.getElementById('categorie_id').value || null,
      quantite: parseInt(document.getElementById('quantite').value, 10) || 1,
      groupe_id: groupeChoisi,
      dans_groupe: groupeChoisi ? checkboxDansGroupe.checked : false,
      localisation_id: document.getElementById('localisation_id').value || null,
      prix_achat: document.getElementById('prix_achat').value || null,
      date_achat: document.getElementById('date_achat').value || null,
      magasin: document.getElementById('magasin').value.trim() || null,
      numero_serie: document.getElementById('numero_serie').value.trim() || null,
      date_garantie: document.getElementById('date_garantie').value || null,
      notes: document.getElementById('notes').value.trim() || null,
    }

    const { error } = await supabase.from('outils').update(valeurs).eq('id', outilId)
    if (error) {
      afficherToast('Erreur lors de l\'enregistrement')
      return
    }
    afficherToast('Outil enregistré')
  })
}

document.getElementById('btn-supprimer').addEventListener('click', async () => {
  if (!outilId) return
  if (!confirm('Supprimer définitivement cet outil ?')) return

  const { error } = await supabase.from('outils').delete().eq('id', outilId)
  if (error) {
    afficherToast('Erreur lors de la suppression')
    return
  }
  window.location.href = 'outils.html'
})
</script>
</body>
</html>
