<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Groupes — Inventaire Outils</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <h1>Groupes</h1>
</header>

<main class="container">
  <div id="liste-groupes"><div class="loading">Chargement...</div></div>
</main>

<button class="fab" id="btn-ajouter" aria-label="Ajouter un groupe">+</button>

<!-- Modal ajout rapide -->
<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h2>Nouveau groupe</h2>
      <button class="btn-icon" id="btn-fermer-modal">✕</button>
    </div>
    <form id="form-groupe">
      <div class="field">
        <label for="nom">Nom *</label>
        <input type="text" id="nom" required placeholder="Ex : Packout rouge, Bac échafaudage">
      </div>
      <div class="field">
        <label for="type_id">Type</label>
        <select id="type_id"></select>
      </div>
      <div class="field">
        <label for="localisation_id">Localisation</label>
        <select id="localisation_id">
          <option value="">— Aucune —</option>
        </select>
      </div>
      <div class="field">
        <label for="notes">Notes</label>
        <textarea id="notes" placeholder="Optionnel"></textarea>
      </div>
      <div class="field">
        <label>Photo</label>
        <label class="btn btn-secondary btn-block" style="cursor:pointer;">
          <span id="texte-label-photo">Prendre / choisir une photo</span>
          <input type="file" accept="image/*" id="input-photo" class="hidden">
        </label>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-block">Ajouter</button>
      </div>
    </form>
  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html"><span class="icon">🏠</span>Accueil</a>
  <a href="outils.html"><span class="icon">🔧</span>Outils</a>
  <a href="groupes.html" class="active"><span class="icon">📦</span>Groupes</a>
  <a href="localisations.html"><span class="icon">📍</span>Lieux</a>
  <a href="notes.html"><span class="icon">📝</span>Notes</a>
</nav>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/photo.js"></script>
<script src="js/groupes.js"></script>
</body>
</html>
